# ============================================================================
# Codeforces Rating & Tag Experiment — central config (seed 42 everywhere)
# Consumed by experiments/src/*.py. All paths are relative to the repo root.
# ============================================================================
seed: 42

paths:
  rating_csv: "Datasets/Regression_Dataset/codeforces_rating_regression.csv"
  tags_csv:   "Datasets/Classification_Dataset/codeforces_tag_classification.csv"
  results_dir: "experiments/results"
  cache_dir:   "experiments/results/cache"
  figures_dir: "experiments/results/figures"
  models_dir:  "experiments/models"

# ---- evaluation protocol (§2) ----
split:
  test_size: 0.20          # locked hold-out via GroupShuffleSplit on cv_group
  n_folds: 5               # GroupKFold within the training 80%
  group_col: "cv_group"

# ---- text / numeric columns ----
columns:
  text_proc: "statement_proc"          # TF-IDF-ready (NaN -> '' before use)
  text_clean: "statement_clean_norm"
  numeric:                              # the 18 standardized structural/stat features
    - time_limit_sec
    - memory_limit_mb
    - statement_length_chars
    - statement_length_words
    - num_lessequal
    - num_greaterequal
    - num_equals
    - num_numeric_tokens
    - avg_word_length
    - sentence_count
    - avg_sentence_length_words
    - digit_count
    - uppercase_ratio
    - digit_ratio
    - punctuation_ratio
    - math_symbol_count
    - unique_word_ratio
    - example_count

# ---- feature blocks (§3) ----
features:
  tfidf_word_12: {ngram_range: [1, 2], min_df: 5, max_features: 30000, sublinear_tf: true, analyzer: word}
  tfidf_word_1:  {ngram_range: [1, 1], min_df: 5, max_features: 30000, sublinear_tf: true, analyzer: word}
  tfidf_char_35: {ngram_range: [3, 5], min_df: 5, max_features: 30000, sublinear_tf: true, analyzer: char_wb}
  lsa_dim: 300
  w2v: {vector_size: 100, window: 5, min_count: 5, sg: 1, epochs: 5, workers: 4}

# ---- tuning grids (§4.3 / §5.4) ----
grids:
  ridge_alpha: [1, 10, 30, 100]
  linsvr_C: [0.5, 1, 3]
  knn_k: [15, 30, 50]
  rf_rating: {n_estimators: [400], max_depth: [null, 24], max_features: ["sqrt", 0.3]}
  lgbm_rating: {learning_rate: 0.05, num_leaves: 63, n_estimators: 2000, early_stopping: 50}
  logreg_C: [1, 3, 10]
  linsvc_C: [0.3, 1, 3]
  cnb_alpha: [0.1, 0.3, 1.0]

tags:
  rare_floor: 15            # report a >=15-train-example subset alongside all 38
  special_tag: "*special"   # reported separately
  threshold_grid_steps: 41  # per-label decision-threshold search resolution

rating:
  ordinal_bins: [800, 1000, 1200, 1400, 1600, 1800, 2000, 2200, 2400, 2600, 2900, 3500]
